# Cross ’em's iOS kit: an Xcode project that builds the game as one app for
# iPhone and iPad, which someone opens in Xcode, signs with their own Apple
# ID, and runs on a device (PACKAGING.md, "iPhone and iPad").
#
# Adapted from Lota's experimental, unsupported iOS kit workflow,
# .github/workflows/ios-kit.yml at setdef/Lota commit 5e68d3d (branch
# experiment/ios-kit-1; its guide is doc/contributors/ios-kit.md there),
# under the same license. Lota's CI never builds a game's app, so Cross ’em
# builds its own here, keeping that workflow's three jobs: the project,
# built and zipped (ios-kit); a fresh runner that builds that zip, checks
# the built app, and runs it in portrait in iPad and iPhone Simulators
# (ios-kit-simulator); and a third that runs it in landscape, then taps and
# turns the screen (ios-kit-touch).
#
# The app is built from released code only: Lota's v0.1.3 tag (its gem,
# vendor/love, and rake ios:sdl3), Fledge v0.5.1's fledge build ios, and
# ios/, Cross ’em's copies of the experiment's project scripts (prepare.rb,
# icon.rb, the SDL host in host/ios, and the kit's text files, README.txt
# changed to say where this repository's kit is). Only the two Simulator
# jobs take anything from the experiment branch at 5e68d3d: check_app.rb and
# the UI tests in ipad/uitests, which never reach the kit. They run
# ios/simulator.rb, a copy of the experiment's that checks more patiently
# whether the app still runs, and the touch job adds a CI-only probe
# (ios/touch_probe.rb) that prints where each tap landed. A v0.* tag also
# attaches the kit to that tag's prerelease.
#
# Lota is a path gem only inside the project job's generated project;
# this repository's Gemfile keeps Lota 0.1.3 from vendor/cache.
name: iOS kit

on:
  push:
    tags: ["v0.*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A tag's run finishes; a newer dispatch on the same ref waits for it.
concurrency:
  group: ios-kit-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  MISE_DISABLE_TOOLS: ruby,rust
  FLEDGE_REF: v0.5.1
  LOTA_REPOSITORY: setdef/Lota
  # The released Lota the app is built from.
  LOTA_REF: v0.1.3
  # The experiment's Simulator checks, pinned: the tip of experiment/ios-kit-1.
  LOTA_KIT_SHA: 5e68d3d9d79693b26760d62f1d0f972bc0f6ed7a
  KIT_GAME_REPOSITORY: ${{ github.repository }}
  KIT_GAME_REF: ${{ github.ref_name }}
  KIT_GAME_PATH: "."
  KIT_DISPLAY_NAME: Cross ’em
  KIT_APP_NAME: CrossEm
  KIT_IDENTIFIER: com.kerricklong.CrossEm
  KIT_PROGRAM: bin/cross_em
  KIT_ICON: icons/icon-1024.png
  KIT_ORIENTATIONS: "iphone: portrait landscape; ipad: all"
  KIT_AUDIO_CATEGORY: ambient
  KIT_HIDE_STATUS_BAR: "true"
  KIT_QUESTIONS: doc/playtest-questions.txt
  # The Simulator's normal launches play No. 1720 to a win by themselves,
  # take two screenshots, and quit with 0 (main.rb lists the settings).
  # simulator.rb splits these on spaces, so no value may hold one.
  KIT_SMOKE_ENV: >-
    CROSS_EM_SAVE_AS=ci_smoke CROSS_EM_TODAY=2026-11-05
    CROSS_EM_SCRIPT=close,word:MITER:0:0:across,word:WALKER:3:-4:down,word:JAK:2:-3:across
    CROSS_EM_SHOTS=3,8 CROSS_EM_QUIT_AFTER=12
  # ASCII only: the harness runs on the runner's own Ruby 2.6, whose ENV
  # strings may not be UTF-8. The second shot comes 8 s in.
  KIT_SMOKE_EXPECT: 'screenshot .*shot-2\.png'
  KIT_SMOKE_SECONDS: "25"
  KIT_EXTRA_LAUNCHES: ""
  # The touch test taps for about a minute: it needs the game running, on
  # the board with no sheet open and no word placed, and printing each
  # touch (ios/touch_probe.rb).
  KIT_TOUCH_ENV: CROSS_EM_SAVE_AS=ci_touch CROSS_EM_SCRIPT=close CROSS_EM_SHOTS= CROSS_EM_QUIT_AFTER=300 CROSS_EM_TOUCH_PROBE=1
  KIT_DEVICES: >-
    iPad Pro 13-inch (M5)|iPad Pro 13-inch (M4);
    iPad (A16)|iPad (10th generation);
    iPad mini (A17 Pro)|iPad mini (6th generation);
    iPhone 17 Pro|iPhone 16 Pro;
    ?iPhone 16e|iPhone SE (3rd generation)
  KIT_TOUCH_DEVICES: iPad Pro 13-inch,iPhone 17 Pro,iPhone 16 Pro

jobs:
  project:
    name: The Xcode project
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: game

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.LOTA_REPOSITORY }}
          ref: ${{ env.LOTA_REF }}
          persist-credentials: false
          path: lota

      - name: Fetch the submodules Lota's iOS build needs
        working-directory: lota
        run: git submodule update --init --depth 1 vendor/love vendor/love-apple-dependencies

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          working-directory: lota

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11
          install_args: cmake ninja
          working_directory: lota

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          cmake --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Install Lota's bundle
        working-directory: lota
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/lota/bundle" >> "$GITHUB_ENV"
          BUNDLE_PATH=$HOME/.cache/lota/bundle bundle install

      - name: Build SDL3 for iOS
        working-directory: lota
        run: bundle exec rake ios:sdl3

      - name: Note the game's commit
        run: |
          clone=$GITHUB_WORKSPACE/game
          sha=$(git -C "$clone" rev-parse HEAD)
          echo "$KIT_GAME_REPOSITORY $KIT_GAME_REF is $sha"
          { echo "KIT_GAME_CLONE=$clone"; echo "KIT_GAME_SHA=$sha"; } >> "$GITHUB_ENV"

      # Lota's gem ships only these paths (lota.gemspec), and a path gem
      # carries its whole folder into the app, so the app gets a folder
      # with them alone rather than Lota's checkout, with its submodules
      # and builds. The extension still builds from the checkout's
      # vendor/love (--with-lota-source).
      - name: Lay out the project
        working-directory: lota
        run: |
          gem=$RUNNER_TEMP/lota-gem
          mkdir -p "$gem"
          git archive HEAD lota.gemspec exe lib sig README.rdoc CHANGELOG.md LICENSE LICENSES ext/lota/extconf.rb \
            ext/lota/CMakeLists.txt ext/lota/cmake ext/lota/engine ext/lota/native ext/lota/phone ext/lota/preload | tar -x -C "$gem"
          git -C "$gem" init --quiet
          git -C "$gem" add -A
          git -C "$gem" -c user.name=ios-kit -c user.email=ios-kit@example.com commit --quiet -m "Lota's gem files"
          du -sh "$gem"
          export KIT_LOTA_GEM=$gem KIT_FLEDGE_REF=$FLEDGE_REF KIT_PROJECT=$RUNNER_TEMP/project KIT_JSON=$RUNNER_TEMP/kit/kit.json
          export KIT_LOTA_REPOSITORY=$LOTA_REPOSITORY KIT_LOTA_SHA=$(git rev-parse HEAD) KIT_LOTA_REF=$LOTA_REF KIT_RUN_ID=$GITHUB_RUN_ID
          export KIT_RUN_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          mkdir -p "$RUNNER_TEMP/kit"
          ruby "$GITHUB_WORKSPACE/game/ios/prepare.rb" layout
          echo "APP_NAME=$(ruby -rjson -e 'print JSON.parse(File.read(ARGV[0]))["app_name"]' "$KIT_JSON")" >> "$GITHUB_ENV"
          cd "$KIT_PROJECT"
          cat Gemfile fledge.yml
          find . -path ./game -prune -o -print | sort | head -60

      - name: Build the app with fledge build ios
        run: |
          lota=$GITHUB_WORKSPACE/lota
          rice=$(cd "$lota" && bundle exec ruby -e 'print Gem.loaded_specs.fetch("rice").full_gem_path')
          cd "$RUNNER_TEMP/project"
          export LOTA_SOURCE=$lota BUNDLE_GEMFILE=$PWD/Gemfile BUNDLE_PATH=$RUNNER_TEMP/app-bundle
          export XDG_CACHE_HOME=$RUNNER_TEMP/cache
          bundle config set --local build.lota \
            "--with-lota-source=$lota --with-lota-sdl3=$lota/tmp/ios/sdl3 --with-rice-dir=$rice"
          bundle lock --add-platform ruby
          bundle install
          bundle exec fledge --version
          time bundle exec fledge build ios --out "$RUNNER_TEMP/dist"
          ls -la "$RUNNER_TEMP/dist/$APP_NAME-ios"

      - name: Check that the project stands on its own, and finish it
        working-directory: lota
        run: |
          project=$RUNNER_TEMP/dist/$APP_NAME-ios
          # Nothing in what Xcode reads may point at this runner.
          if grep -rIl -e "$RUNNER_TEMP" -e "$GITHUB_WORKSPACE" -e /Users/runner \
              "$project/project.yml" "$project/$APP_NAME.xcodeproj" "$project/Host" "$project/fledge/fledge.cfg"; then
            echo "::error::the project names a path on this runner"; exit 1
          fi
          echo "symbolic links: $(find "$project" -type l | wc -l)"
          grep -n "APP_DISPLAY_NAME" "$project/project.yml" "$project/$APP_NAME.xcodeproj/project.pbxproj"
          export KIT_JSON=$RUNNER_TEMP/kit/kit.json
          export KIT_XCODE="$(xcodebuild -version | head -1)"
          export KIT_BUILT_WITH="Built on $(sw_vers -productName) $(sw_vers -productVersion) with $(xcodebuild -version | tr '\n' ' ')and XcodeGen $(xcodegen --version | sed 's/Version: //')"
          ruby "$GITHUB_WORKSPACE/game/ios/prepare.rb" finish "$project"
          du -sh "$project"/*
          find "$project/fledge" -maxdepth 3 | sort | head -40

      - name: Zip the project with its symbolic links
        run: |
          cd "$RUNNER_TEMP/dist"
          zip -qry "$RUNNER_TEMP/kit/$APP_NAME-ios.zip" "$APP_NAME-ios"
          cd "$RUNNER_TEMP/kit"
          shasum -a 256 "$APP_NAME-ios.zip" kit.json > SHA256SUMS
          cat SHA256SUMS
          ls -la

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-kit
          path: ${{ runner.temp }}/kit
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Build the project on a fresh Mac and run it in portrait
    needs: project
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      # Only the experiment's Simulator checks from Lota; no Lota gem, no
      # bundle, no submodules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.LOTA_REPOSITORY }}
          ref: ${{ env.LOTA_KIT_SHA }}
          persist-credentials: false
          sparse-checkout: ipad
          path: lota

      # And ios/, Cross ’em's copies of Lota's scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ios
          path: game

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-kit
          path: ${{ runner.temp }}/download

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun simctl list runtimes
          command -v xcodegen || echo "no xcodegen on this runner"
          gem list -i lota || echo "no lota gem on this runner"
          gem list -i fledge || echo "no fledge gem on this runner"

      - name: Check and unpack the artifact
        run: |
          cd "$RUNNER_TEMP/download"
          shasum -a 256 -c SHA256SUMS
          ls -la
          app_name=$(/usr/bin/ruby -rjson -e 'print JSON.parse(File.read("kit.json"))["app_name"]')
          identifier=$(/usr/bin/ruby -rjson -e 'print JSON.parse(File.read("kit.json"))["identifier"]')
          { echo "APP_NAME=$app_name"; echo "APP_IDENTIFIER=$identifier"; } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/unpacked"
          ditto -x -k "$app_name-ios.zip" "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP/unpacked/$app_name-ios"
          ls -la
          echo "symbolic links: $(find . -type l | wc -l)"
          cat BUILD-INFO.txt

      - name: Build for the Simulator and, unsigned, for devices
        run: |
          cd "$RUNNER_TEMP/unpacked/$APP_NAME-ios"
          xcodebuild -list -project "$APP_NAME.xcodeproj"
          mkdir -p "$RUNNER_TEMP/logs"
          for build in "Debug iphonesimulator" "Debug iphoneos" "Release iphoneos"; do
            set -- $build
            log=$RUNNER_TEMP/logs/xcodebuild-$1-$2.log
            xcodebuild -project "$APP_NAME.xcodeproj" -scheme "$APP_NAME" -configuration "$1" -sdk "$2" \
              -derivedDataPath "$RUNNER_TEMP/derived" build CODE_SIGNING_ALLOWED=NO > "$log" 2>&1 \
              || { tail -80 "$log"; exit 1; }
            grep -E "warning:|error:|BUILD" "$log" | sort | uniq -c | head -40
          done
          for app in "$RUNNER_TEMP"/derived/Build/Products/*/"$APP_NAME.app"; do
            echo "== $app"
            plutil -p "$app/Info.plist"
            /usr/bin/ruby "$GITHUB_WORKSPACE/lota/ipad/check_app.rb" "$app" "$RUNNER_TEMP/download/kit.json"
            xcrun vtool -show-build "$app/$APP_NAME" | head -12
            du -sh "$app"
          done

      - name: Run the app in portrait in iPad and iPhone Simulators
        run: |
          app=$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/$APP_NAME.app
          IFS=';' read -ra devices <<< "$KIT_DEVICES"
          devices=("${devices[@]# }")
          /usr/bin/ruby game/ios/simulator.rb "$app" "$APP_IDENTIFIER" "$APP_NAME" "$RUNNER_TEMP/simulator" portrait "${devices[@]}"

      - name: Zip the Simulator app
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/simapp"
          cd "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator"
          ditto -c -k --keepParent "$APP_NAME.app" "$RUNNER_TEMP/simapp/$APP_NAME-simulator.app.zip"
          cd "$RUNNER_TEMP/simapp"
          shasum -a 256 ./*.zip > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-kit-simulator
          path: |
            ${{ runner.temp }}/simulator
            ${{ runner.temp }}/simapp
            ${{ runner.temp }}/logs
          retention-days: 30

  touch:
    name: Landscape, touch, and rotation (CI-only UI tests)
    needs: project
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.LOTA_REPOSITORY }}
          ref: ${{ env.LOTA_KIT_SHA }}
          persist-credentials: false
          sparse-checkout: ipad
          path: lota

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ios
          path: game

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-kit
          path: ${{ runner.temp }}/download

      - name: Select the newest Xcode and install XcodeGen
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          brew install xcodegen

      # A copy of the kit's project with a UI test target, which the zip
      # never holds: its runner is a second app, with a second App ID. The
      # copy's game also loads ios/touch_probe.rb, which prints each touch.
      - name: Add the UI tests and the touch probe to a copy of the project
        run: |
          cd "$RUNNER_TEMP/download"
          shasum -a 256 -c SHA256SUMS
          app_name=$(/usr/bin/ruby -rjson -e 'print JSON.parse(File.read("kit.json"))["app_name"]')
          identifier=$(/usr/bin/ruby -rjson -e 'print JSON.parse(File.read("kit.json"))["identifier"]')
          { echo "APP_NAME=$app_name"; echo "APP_IDENTIFIER=$identifier"; } >> "$GITHUB_ENV"
          ditto -x -k "$app_name-ios.zip" "$RUNNER_TEMP/touch"
          project=$RUNNER_TEMP/touch/$app_name-ios
          main=$(find "$project/fledge" -path '*/bin/cross_em' -type f | head -1)
          [ -n "$main" ] || { echo "::error::no bin/cross_em in the kit's fledge folder"; exit 1; }
          game=$(dirname "$(dirname "$main")")
          echo "the game in the copy: $game"
          cp "$GITHUB_WORKSPACE/game/ios/touch_probe.rb" "$game/ios/touch_probe.rb"
          printf '\n# CI only (ios-kit.yml, touch job).\nrequire_relative "ios/touch_probe"\n' >> "$game/main.rb"
          tail -4 "$game/main.rb"
          mkdir -p "$project/UITests"
          cp "$GITHUB_WORKSPACE"/lota/ipad/uitests/*.m "$project/UITests/"
          /usr/bin/ruby -ryaml -e '
            path, name, id = ARGV
            spec = YAML.load_file(path)
            spec["targets"]["#{name}UITests"] = {
              "type" => "bundle.ui-testing", "platform" => "iOS", "sources" => [{ "path" => "UITests" }],
              "dependencies" => [{ "target" => name }],
              "settings" => { "base" => { "GENERATE_INFOPLIST_FILE" => true, "TEST_TARGET_NAME" => name,
                "PRODUCT_BUNDLE_IDENTIFIER" => "#{id}UITests", "CLANG_ENABLE_MODULES" => true, "OTHER_LDFLAGS" => "" } }
            }
            spec["targets"][name]["scheme"] = { "testTargets" => ["#{name}UITests"] }
            File.write(path, YAML.dump(spec))
          ' "$project/project.yml" "$app_name" "$identifier"
          xcodegen generate --spec "$project/project.yml" --project "$project"
          xcodebuild build-for-testing -project "$project/$app_name.xcodeproj" -scheme "$app_name" \
            -destination "generic/platform=iOS Simulator" -derivedDataPath "$RUNNER_TEMP/touch-derived" CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/build-for-testing.log" 2>&1 || { tail -80 "$RUNNER_TEMP/build-for-testing.log"; exit 1; }
          ls "$RUNNER_TEMP"/touch-derived/Build/Products

      - name: Run the app in landscape, and tap and turn it
        run: |
          products=$RUNNER_TEMP/touch-derived/Build/Products
          app=$products/Debug-iphonesimulator/$APP_NAME.app
          IFS=';' read -ra devices <<< "$KIT_DEVICES"
          devices=("${devices[@]# }")
          KIT_EXTRA_LAUNCHES="" KIT_XCTESTRUN=$(ls "$products"/*.xctestrun | head -1) \
            /usr/bin/ruby game/ios/simulator.rb "$app" "$APP_IDENTIFIER" "$APP_NAME" "$RUNNER_TEMP/landscape" landscape "${devices[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-kit-touch
          path: |
            ${{ runner.temp }}/landscape
            ${{ runner.temp }}/build-for-testing.log
          retention-days: 30

  release:
    name: Attach the kit to the tag's prerelease
    needs: [project, verify, touch]
    if: startsWith(github.ref, 'refs/tags/v0.')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-kit
          path: kit

      # The Package workflow's release job may have made the release
      # already; this adds to it, or makes it if it is missing.
      - name: Attach the kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd kit
          shasum -a 256 -c SHA256SUMS
          app_name=$(ruby -rjson -e 'print JSON.parse(File.read("kit.json"))["app_name"]')
          shasum -a 256 "$app_name-ios.zip" > "$app_name-ios-SHA256SUMS.txt"
          files=("$app_name-ios.zip" "$app_name-ios-SHA256SUMS.txt")
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "Cross ’em $tag" --prerelease \
              --notes "Built by the Package and iOS kit workflows from $GITHUB_SHA. See PACKAGING.md." \
              || echo "the release appeared meanwhile; adding to it"
          fi
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
