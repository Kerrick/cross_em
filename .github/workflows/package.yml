# Builds Cross ’em into apps people without Ruby can run, with `lota fuse`
# (PACKAGING.md): on Linux an AppImage and a .tar.gz, on Windows a .zip and an
# NSIS -setup.exe, on macOS a .dmg and a .tar.gz. Each build is checked
# without a window, since runners have no GPU. A v0.* tag also attaches
# them to a GitHub prerelease. Nothing is published to RubyGems.

name: Package

on:
  push:
    branches: [main]
    tags: ["v0.*"]
  workflow_dispatch:

permissions:
  contents: read

# A run in progress finishes, so that frequent pushes still leave builds
# to download; only the newest waiting run is kept.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Lota is not on RubyGems.org; its gems are on this release.
  LOTA_VERSION: "0.1.3"
  IDENTIFIER: com.kerricklong.CrossEm

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version
      # bin/setup puts Lota's gems in vendor/cache, then runs bundle install.
      - run: bin/setup
      - run: bundle exec rake test

  fuse:
    name: Fuse (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            platform: x86_64-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            platform: aarch64-linux-gnu
          - name: windows-x64
            runner: windows-latest
            platform: x64-mingw-ucrt
          - name: macos-arm64
            runner: macos-15
            platform: arm64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The OpenGL and EGL libraries SDL opens, which a desktop has and a
      # runner does not; Lota loads without a display.
      - name: Install OpenGL's libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes libgl1 libegl1

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version
          windows-toolchain: none

      - name: Get Lota's gem for this platform, check it, and install it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sum() { if command -v sha256sum > /dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          gems="$RUNNER_TEMP/gems"
          mkdir -p "$gems"
          gem_file="lota-$LOTA_VERSION-$PLATFORM.gem"
          base="https://github.com/setdef/Lota/releases/download/v$LOTA_VERSION"
          curl --fail --location --silent --show-error --output "$gems/$gem_file" "$base/$gem_file"
          curl --fail --location --silent --show-error --output "$gems/SHA256SUMS" "$base/SHA256SUMS"
          (cd "$gems" && grep " $gem_file\$" SHA256SUMS | sum --check -)
          gem install --local "$gems/$gem_file"
          lota --version

      - name: Work out the app's version
        run: |
          # A v0.X.Y tag is 0.X.Y; any other build is 0.0.N, N being the
          # run number, which is numeric, as every installer's version is.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.$GITHUB_RUN_NUMBER"
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "app version: $version"

      - name: lota fuse
        run: |
          lota fuse . --identifier "$IDENTIFIER" --app-version "$APP_VERSION" --icon icons/icon --out dist
          ls -la dist

      - name: Check the build with no window, with the app's own Ruby
        run: script/smoke.sh dist

      # The mesa and Xvfb packages stand in for a GPU and a display. The
      # game is to quit by itself after CROSS_EM_QUIT_AFTER seconds, with
      # status 0. Not required to pass yet.
      - name: Run the Linux app headless, under Xvfb and Mesa's llvmpipe
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get install --assume-yes xvfb libgl1-mesa-dri libglx-mesa0 libopenal1
          work="$RUNNER_TEMP/headless"
          mkdir -p "$work/tar" "$work/appimage"
          tar -xzf dist/*.tar.gz -C "$work/tar"
          program=$(find "$work/tar" -maxdepth 2 -type f -executable -name 'Cross *' | head -1)
          echo "tar.gz program: $program"
          run() {
            xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
              env CROSS_EM_QUIT_AFTER=5 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe ALSOFT_DRIVERS=null \
              timeout 120 "$@"
          }
          echo "=== the unpacked .tar.gz"
          run "$program"
          echo "=== the AppImage"
          cp dist/*.AppImage "$work/appimage/app.AppImage"
          chmod +x "$work/appimage/app.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 run "$work/appimage/app.AppImage"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-em-${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    name: Release
    needs: fuse
    if: startsWith(github.ref, 'refs/tags/v0.')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cross-em-*
          path: artifacts
          merge-multiple: true
      - name: Attach the builds to the tag's prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber artifacts/*
          else
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "Cross ’em $tag" \
              --notes "Built by the Package workflow from $GITHUB_SHA. See PACKAGING.md." --prerelease artifacts/*
          fi
